[project]
name = "spendgate"
version = "0.1.0"
description = "Deterministic spending authority for AI agents on Razorpay and UPI Circle rails"
requires-python = ">=3.12"
dependencies = []

# Phase 2 onward. The engine and ledger stay dependency-free; these are only
# needed for the HTTP boundary, the mock merchant and the rail client.

[project.optional-dependencies]
dev = ["pytest>=8"]
http = ["httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = [
  # uvicorn 0.42 still imports websockets.legacy; not our code, not our fix.
  "ignore:websockets.legacy is deprecated:DeprecationWarning",
  "ignore:websockets.server.WebSocketServerProtocol is deprecated:DeprecationWarning",
]
